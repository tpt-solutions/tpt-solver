# cargo-deny configuration for tpt-solver.
#
# Wired into CI as an advisory (non-blocking) job — see `.github/workflows/ci.yml`
# — so a new RUSTSEC advisory or license drift is visible without breaking
# unrelated PRs. Tighten to blocking once the team has seen it run clean for a
# while.

[advisories]
yanked = "warn"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
