[package]
name = "tpt-solver-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
readme = "README.md"
changelog = "CHANGELOG.md"
keywords = [
    "fuzzing",
    "sat",
    "smt",
    "testing",
    "differential-testing",
]
categories = [
    "development-tools",
    "algorithms",
]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.tpt-solver]
path = "../tpt-solver"

[workspace]

[[bin]]
name = "dimacs"
path = "fuzz_targets/dimacs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mps"
path = "fuzz_targets/mps.rs"
test = false
doc = false
bench = false

[[bin]]
name = "smtlib2"
path = "fuzz_targets/smtlib2.rs"
test = false
doc = false
bench = false
