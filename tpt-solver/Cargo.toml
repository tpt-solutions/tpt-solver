[package]
name = "tpt-solver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/tpt-solver"
include = [
    "Cargo.toml",
    "README.md",
    "CHANGELOG.md",
    "LICENSE-*",
    "src/**/*",
    "tests/**/*",
    "examples/**/*",
]
description = "Periphery for the tpt-solver suite: parsers, CLI, e-graph preprocessing, and integration glue"
readme = "README.md"
keywords = [
    "sat",
    "smt",
    "solver",
    "cli",
    "parsing",
]
categories = [
    "command-line-utilities",
    "algorithms",
    "parsing",
]

# Config for 'dist'
[package.metadata.dist]

[lib]
name = "tpt_solver"
path = "src/lib.rs"

[[bin]]
name = "tpt-solver"
path = "src/main.rs"

[dependencies]
tpt-solver-core = { path = "../tpt-solver-core", version = "0.1.0" }
tpt-solver-check = { path = "../tpt-solver-check", version = "0.1.0" }
# Boolean-formula preprocessing uses a small, dependency-free in-house e-graph
# (see `src/egraph.rs`) instead of the external `egg` crate (spec §4.3, §7).
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
# Gzip-compressed inputs (pure-Rust backend, so the build stays portable).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
# Truth-table equivalence checking of the e-graph simplification pass.
proptest = "1"

[[bench]]
name = "solve"
harness = false

[features]
default = ["std"]
std = []
