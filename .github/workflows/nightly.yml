name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  corpus:
    name: Corpus benchmark (certified)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release -p tpt-solver --bin tpt-solver
      - name: Run the corpus
        # Fails the job if the checker rejects any answer.
        run: python3 bench/run.py
      - uses: actions/upload-artifact@v4
        with:
          name: corpus-results
          path: bench/results.csv

  criterion:
    name: Criterion benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run criterion
        run: cargo bench -p tpt-solver --bench solve -- --warm-up-time 2 --measurement-time 5
      - uses: actions/upload-artifact@v4
        with:
          name: criterion-report
          path: target/criterion

  coverage:
    name: Line coverage (llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Measure coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info
