name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace --verbose
      - name: Test
        run: cargo test --workspace --verbose
      # Property/E2E verification (proptest invariants in `tpt-solver-core`,
      # the certificate pipeline, DIMACS/SMT-LIB2 parsing), the internal
      # differential harness (CDCL vs reference DPLL) and the reject/inconclusive/
      # accept rate gate (spec §6.3) all run as part of `cargo test`.

  differential-z3:
    name: Differential vs Z3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Z3
        run: sudo apt-get update && sudo apt-get install -y z3
      - name: Differential tests vs Z3 oracle
        # `differential_vs_z3_when_available` (QF_SAT) and
        # `differential_lra_vs_z3_when_available` (QF_LRA) shell out to `z3`; with
        # Z3 installed they compare tpt-solver's claims against a real external
        # oracle.
        run: "cargo test -p tpt-solver --lib differential:: --verbose"

  kani:
    name: Kani proofs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Kani
        # Prebuilt kani-verifier binary: building it from source with `cargo install`
        # took most of the job's time. The repo's rust-toolchain.toml pins 1.85,
        # which the prebuilt binary doesn't need, but `cargo kani setup` still
        # downloads the CBMC bundle.
        uses: taiki-e/install-action@v2
        with:
          tool: kani-verifier
      - name: Set up Kani
        run: cargo kani setup
      - name: Run Kani harnesses (core)
        # `cargo kani` provides the `kani` crate and sets `cfg(kani)`; no Cargo
        # dependency or feature flag is required.
        run: cargo kani -p tpt-solver-core

  loom:
    name: Loom (portfolio cancellation flag)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Model-check cancel::Cancel under every thread interleaving
        # `cancel::Cancel` (tpt-solver-core/src/cancel.rs) is the one piece of
        # shared-state concurrency the suite introduces, for racing portfolio
        # SAT workers (tpt-solver/src/portfolio.rs). The `loom` feature swaps
        # in loom's shadow Arc/AtomicBool; `--cfg loom` is required for loom's
        # own instrumentation to activate.
        run: RUSTFLAGS="--cfg loom" cargo test -p tpt-solver-core --release --features loom --test loom_cancel -- --test-threads=1

  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - name: cargo check on the declared MSRV
        run: cargo check --workspace

  cargo-deny:
    name: cargo-deny (advisories, licenses, bans)
    runs-on: ubuntu-latest
    # Advisory only: reports RUSTSEC advisories, license policy, and duplicate/
    # wildcard dependency issues without failing the build. A new advisory landing
    # upstream shouldn't block unrelated PRs; tighten to blocking once this has run
    # clean for a while.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        # Pinned: 0.18.3 can't parse CVSS 4.0 advisories (RUSTSEC-2025-0138), which
        # the current advisory DB contains. Install with stable, not the repo's
        # rust-toolchain.toml (1.85), because 0.20+ requires rustc 1.88.
        run: RUSTUP_TOOLCHAIN=stable cargo install cargo-deny --locked --version 0.20.2
      - name: cargo deny check
        run: cargo deny check

  fuzz-smoke-test:
    name: Fuzz smoke test (dimacs, mps, smtlib2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        # Prebuilt binary rather than `cargo install`, which compiled from source on
        # every run. The repo's rust-toolchain.toml pins 1.85, which rustup applies
        # over the nightly default set above; `+nightly` overrides the file.
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Fuzz each target for 60s
        # Short timed runs, not a full fuzzing campaign: enough to catch an
        # immediate regression (e.g. the parser panics/stack overflows fixed in
        # Phase 6) on every PR, while a real fuzzing campaign stays a manual
        # `cargo +nightly fuzz run <target>` outside CI.
        # `-timeout=10` caps a single hanging input; libFuzzer's default is 1200s,
        # and `-max_total_time` alone doesn't stop a run stuck on one input.
        run: |
          for target in dimacs mps smtlib2; do
            cargo +nightly fuzz run "$target" -- -max_total_time=60 -timeout=10
          done
