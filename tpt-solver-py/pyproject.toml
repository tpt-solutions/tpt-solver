[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "tpt-solver"
version = "0.1.0"
description = "Certificate-checked SAT and SMT solving: every answer is verified by an independent kernel"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "TPT Solutions" }]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/tpt-solutions/tpt-solver"
Repository = "https://github.com/tpt-solutions/tpt-solver"

[tool.maturin]
module-name = "tpt_solver"
