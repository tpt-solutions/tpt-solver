[package]
name = "tpt-solver-check"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/tpt-solver-check"
include = [
    "Cargo.toml",
    "README.md",
    "CHANGELOG.md",
    "LICENSE-*",
    "src/**/*",
    "tests/**/*",
    "examples/**/*",
]
description = "The small, independently-checkable trusted kernel for the tpt-solver suite (LRAT/Farkas/model recheck)"
readme = "README.md"
keywords = [
    "sat",
    "smt",
    "certificate",
    "verification",
    "formal-verification",
]
categories = [
    "algorithms",
    "mathematics",
    "science",
]

[dependencies]
tpt-solver-core = { path = "../tpt-solver-core", version = "0.1.0" }

[features]
default = ["std"]
std = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
